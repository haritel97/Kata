<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kata Majlis – Ucapan, Pantun & Surat</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#2b2118;--mut:#7a6a58;--ac:#b4532a;--ac2:#fff;--bd:#e6dccb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--card:#272019;--tx:#f1e8dc;--mut:#b3a28d;--ac:#e08a5c;--ac2:#1c1713;--bd:#3b3128}}
:root[data-theme="dark"]{--bg:#1c1713;--card:#272019;--tx:#f1e8dc;--mut:#b3a28d;--ac:#e08a5c;--ac2:#1c1713;--bd:#3b3128}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,"Times New Roman",serif;line-height:1.55}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 18px;font-family:system-ui,sans-serif;font-size:.95rem}
.tabs{display:flex;gap:6px;margin-bottom:14px;font-family:system-ui,sans-serif}
.tab{flex:1;padding:10px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:.9rem;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;font-family:system-ui,sans-serif}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:1rem}
textarea{min-height:80px;resize:vertical}
.go{margin-top:16px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:var(--ac2);font-size:1rem;font-weight:600;cursor:pointer}
.go:disabled{opacity:.6}
#out{margin-top:16px;white-space:pre-wrap;font-family:Georgia,serif;font-size:1.05rem;display:none}
.cp{margin-top:10px;padding:8px 14px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;cursor:pointer;font-family:system-ui,sans-serif}
.err{color:#c0392b;margin-top:12px;font-size:.9rem}
.note{font-size:.8rem;color:var(--mut);margin-top:18px;font-family:system-ui,sans-serif}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Kata Majlis</h1>
<p class="sub">Ucapan, pantun dan surat rayuan, siap dalam beberapa saat.</p>

<div class="tabs" role="tablist">
<button class="tab" role="tab" aria-selected="true" data-t="ucapan">Ucapan</button>
<button class="tab" role="tab" aria-selected="false" data-t="pantun">Pantun</button>
<button class="tab" role="tab" aria-selected="false" data-t="surat">Surat Rayuan</button>
</div>

<div class="card">
<div id="f-ucapan">
<label>Jenis majlis</label>
<select id="u-jenis"><option>Kahwin</option><option>Aqiqah</option><option>Kenduri doa selamat</option><option>Hari lahir</option><option>Persaraan</option><option>Hari raya</option></select>
<label>Untuk siapa (nama & hubungan)</label>
<input id="u-nama" placeholder="cth: Aisyah, sepupu saya">
<label>Nada</label>
<select id="u-nada"><option>Sopan</option><option>Mesra</option><option>Lawak</option><option>Sayu</option></select>
<label>Jenis output</label>
<select id="u-out"><option>Ucapan ringkas</option><option>Teks kad jemputan</option></select>
</div>

<div id="f-pantun" class="hide">
<label>Majlis / tujuan</label>
<select id="p-jenis"><option>Pengacara majlis (emcee)</option><option>Merisik</option><option>Hantaran kahwin</option><option>Alu-aluan tetamu</option><option>Hari lahir</option><option>Perpisahan</option></select>
<label>Butiran (nama, tema, dll.)</label>
<input id="p-det" placeholder="cth: pengantin Daniel & Sarah">
<label>Bilangan rangkap</label>
<select id="p-n"><option>2</option><option selected>3</option><option>5</option></select>
</div>

<div id="f-surat" class="hide">
<label>Jenis surat</label>
<select id="s-jenis"><option>Rayuan kurangkan denda / saman</option><option>Rayuan kurangkan bil</option><option>Aduan kepada pihak berkuasa tempatan</option><option>Rayuan lain</option></select>
<label>Kepada (pihak yang dituju)</label>
<input id="s-kpd" placeholder="cth: Pejabat Majlis Perbandaran Keningau">
<label>Nama anda</label>
<input id="s-nama" placeholder="Nama penuh">
<label>Apa yang berlaku & apa yang diminta</label>
<textarea id="s-det" placeholder="Terangkan ringkas kejadian, tarikh, jumlah dan permintaan anda"></textarea>
</div>

<button class="go" id="go">Jana</button>
<div class="err" id="err"></div>
<div id="paywall" class="hide" style="margin-top:12px;font-size:.95rem">Had percuma hari ini sudah habis. <a id="pay" href="#" target="_blank" rel="noopener" style="color:var(--ac);font-weight:600">Bayar RM3 untuk teruskan</a></div>
<div class="note" id="left"></div>
<div id="out"></div>
<button class="cp hide" id="cp">Salin</button>
</div>

<p class="note">Draf dijana AI. Semak dahulu sebelum guna. Surat rayuan ialah draf sahaja dan bukan nasihat guaman.</p>
</main>

<script>
// ---- Tetapan ----
const FREE_PER_DAY = 3;                       // had percuma sehari (per pelayar)
const PAY_URL = "https://toyyibpay.com/GANTI-DENGAN-PAUTAN-ANDA"; // pautan bayaran ToyyibPay/Billplz
// -----------------
const $=id=>document.getElementById(id);
let tab="ucapan";
$("pay").href=PAY_URL;

function usage(){
  const d=new Date().toISOString().slice(0,10);
  try{const u=JSON.parse(localStorage.getItem("km_use")||"{}");return u.d===d?u:{d,n:0}}catch(e){return{d,n:0}}
}
function addUse(){const u=usage();u.n++;try{localStorage.setItem("km_use",JSON.stringify(u))}catch(e){}showLeft()}
function showLeft(){const l=Math.max(0,FREE_PER_DAY-usage().n);$("left").textContent="Percuma hari ini: "+l+" lagi";$("paywall").classList.toggle("hide",l>0)}
showLeft();

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));
  ["ucapan","pantun","surat"].forEach(t=>$("f-"+t).classList.toggle("hide",t!==tab));
  $("out").style.display="none";$("cp").classList.add("hide");$("err").textContent="";
});

function fields(){
  if(tab==="ucapan")return{jenis:$("u-jenis").value,nama:$("u-nama").value,nada:$("u-nada").value,output:$("u-out").value};
  if(tab==="pantun")return{jenis:$("p-jenis").value,det:$("p-det").value,n:$("p-n").value};
  return{jenis:$("s-jenis").value,kpd:$("s-kpd").value,nama:$("s-nama").value,det:$("s-det").value};
}

$("go").onclick=async()=>{
  $("err").textContent="";
  if(usage().n>=FREE_PER_DAY){showLeft();return}
  $("go").disabled=true;$("go").textContent="Sedang menulis...";
  try{
    const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:tab,fields:fields()})});
    const raw=await r.text();let d={};try{d=JSON.parse(raw)}catch(e){}
    if(!r.ok||!d.text)throw new Error(d.error||(r.status===404?"Fungsi server tidak dijumpai (404). Semak deploy.":"Pelayan tidak membalas dengan betul (kod "+r.status+"). Semak Logs > Functions di Netlify."));
    $("out").style.display="block";$("out").textContent=d.text;$("cp").classList.remove("hide");
    addUse();
  }catch(e){$("err").textContent=e.message||"Gagal menjana. Cuba lagi."}
  $("go").disabled=false;$("go").textContent="Jana";
};
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText($("out").textContent);$("cp").textContent="Disalin!";setTimeout(()=>$("cp").textContent="Salin",1500)}catch(e){}};
</script>
</body>
</html>
